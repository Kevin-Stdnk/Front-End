<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de compra e Venda</title>

    <style>
        body{
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
        /* Menu lateral */
        .menu{
            width: 200px;
            height: 100vh;
            background-color: #2c3e50;
            color: white;
            position: fixed;
            padding-top: 20px;
        }

        .menu button{
            width: 100%;
            padding: 15px;
            border: none;
            background: none;
            color: white;
            text-align: left;
            cursor: pointer;
            font-size: 16px;
        }


        .menu button:hover{
            background-color: #34495e;
        }
        /* conteudo */
        .conteudo{
            margin-left: 210px;
            padding: 20px;
        }
        input, button{
            padding: 8px;
            margin: 5px 0;
        }

        .card{
            background-color: #ecf0f1;
            padding: 15px;
            margin-top: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="menu">
        <button onclick=""></button>
    </div>



</body>
</html>
