<h1>{{titulo}}</h1>
<p>Cliques: {{contador}}</p>
<button (click)="incrementar()">Clique aqui para somar</button>
<br>
<div>
  <input type="text" [(ngModel)]="textoDigitado">
  <h3>Resultado:</h3>
  <p><strong>{{ textoDigitado }}</strong></p>
  <button (click)="textoDigitado = ' '">Limpar</button>
</div>
